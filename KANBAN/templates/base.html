<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="refresh" content="30">
		<title>Kanban</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	</head>
	<body>
        <header class="main-header">
<ul class="nav-links">
{% for link in nav_links %}
    <li class="nav-item">
        
        {% if link.children %}
            <div class="dropdown">
                <a href="{{ link.url }}" class="nav-link">
                    {{ link.name }} ▼
                </a>

                <div class="dropdown-menu">
                    {% for child in link.children %}
                        <a href="{{ child.url }}" class="dropdown-item">
                            {{ child.name }}
                        </a>
                    {% endfor %}
                </div>
            </div>
        {% else %}
            <a href="{{ link.url }}" class="nav-link">
                {{ link.name }}
            </a>
        {% endif %}

    </li>
{% endfor %}
</ul>
</header>

        {% block content %}
        {% endblock %}
		
	</body>
    <script>
    // Función que recarga la página
    function refrescarTablero() {
        console.log("Comprobando actualizaciones en Trac...");
        // Por ahora, recargamos la página completa para ver los cambios
        location.reload();
    }

    // Creamos el intervalo: 30000 milisegundos = 30 segundos
    const intervaloCarga = setInterval(refrescarTablero, 30000);

    // Si quieres detenerlo en algún momento, usarías: clearInterval(intervaloCarga);
</script>
</html>
