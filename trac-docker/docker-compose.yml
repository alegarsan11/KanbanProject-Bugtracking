services:
  trac:
    image: binfalse/trac:latest
    container_name: trac
    ports:
      - "8080:80"
    volumes:
      - ./data/projects:/trac/projects
      - ./data/auth:/trac/auth
    restart: always
    user: root
    entrypoint: >
      bash -c "
      echo '--- INICIANDO ---' &&
      mkdir -p /trac/projects/proyecto &&
      [ ! -f /trac/projects/proyecto/conf/trac.ini ] && trac-admin /trac/projects/proyecto initenv proyecto sqlite:db/trac.db && trac-admin /trac/projects/proyecto permission add admin TRAC_ADMIN || echo 'Proyecto ya listo' ;
      sed -i 's/^log_type =.*/log_type = stderr/' /trac/projects/proyecto/conf/trac.ini ;
      sed -i 's/^log_level =.*/log_level = DEBUG/' /trac/projects/proyecto/conf/trac.ini ;
      echo '--- LANZANDO TRACD ---' ;
      exec tracd -p 80 --auth='*,/trac/auth/htpasswd,Trac' --env-parent-dir /trac/projects
      "